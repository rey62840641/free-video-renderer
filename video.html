
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinematic 3-Second Animation</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030712;
  font-family: Arial, Helvetica, sans-serif;
}

.scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 43%,
    #153a75 0%, #09152f 42%, #02040b 100%);
  color: white;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-top: 300px;
  text-align: center;
}

.title {
  margin: 0;
  font-size: clamp(36px, 7vw, 88px);
  font-weight: 900;
  letter-spacing: .12em;
  text-shadow: 0 0 14px #43caff, 0 0 42px #246aff;
  opacity: 0;
  transform: translateY(25px);
}

.subtitle {
  margin-top: 20px;
  font-size: clamp(12px, 1.7vw, 21px);
  letter-spacing: .38em;
  color: #a9dfff;
  opacity: 0;
}

html.ready .title {
  animation: revealTitle .7s ease-out 1.05s forwards;
}

html.ready .subtitle {
  animation: revealSubtitle .6s ease-out 1.55s forwards;
}

@keyframes revealTitle {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes revealSubtitle {
  to { opacity: 1; }
}

</style>
</head>
<body>
<div class="scene">
  <canvas id="art" width="1280" height="720"></canvas>

  <div class="content">
    <h1 class="title">NEXT LEVEL</h1>
    <div class="subtitle">THE FUTURE STARTS NOW</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("art");
  const ctx = canvas.getContext("2d");
  const W = 1280, H = 720;

  // The cloud workflow can set this value before taking each screenshot.
  window.renderFrame = function(frame, fps = 30) {
    const t = frame / fps;
    const progress = Math.max(0, Math.min(1, t / 3));

    ctx.clearRect(0, 0, W, H);

    // Background glow
    const glow = ctx.createRadialGradient(640, 300, 10, 640, 300, 430);
    glow.addColorStop(0, "#174887");
    glow.addColorStop(.5, "#0b1c3e");
    glow.addColorStop(1, "#030610");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // Perspective floor grid
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 360, W, 360);
    ctx.clip();

    ctx.strokeStyle = "rgba(53,143,255,0.25)";
    ctx.lineWidth = 1;

    const offset = (t * 80) % 50;

    for (let y = 365; y < 800; y += 24) {
      const yy = y + offset;
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.lineTo(W, yy);
      ctx.stroke();
    }

    for (let x = -800; x <= 2080; x += 80) {
      ctx.beginPath();
      ctx.moveTo(640, 350);
      ctx.lineTo(x, 720);
      ctx.stroke();
    }
    ctx.restore();

    // Central glowing orb
    const appear = Math.min(1, t / .65);
    const pulse = 1 + Math.sin(t * 5) * .025;
    const radius = 100 * appear * pulse;

    ctx.save();
    ctx.globalAlpha = appear;

    const orb = ctx.createRadialGradient(
      605, 250, 5, 640, 300, radius
    );
    orb.addColorStop(0, "#ffffff");
    orb.addColorStop(.12, "#8df7ff");
    orb.addColorStop(.35, "#268cff");
    orb.addColorStop(.7, "#3036b5");
    orb.addColorStop(1, "rgba(7,14,45,0.1)");

    ctx.shadowColor = "#278fff";
    ctx.shadowBlur = 45;
    ctx.fillStyle = orb;
    ctx.beginPath();
    ctx.arc(640, 300, radius, 0, Math.PI * 2);
    ctx.fill();

    // Rotating elliptical rings
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(640, 300);
      ctx.rotate(t * (i % 2 ? -1.2 : 1.0) + i);
      ctx.scale(1, .32 + i * .08);

      ctx.strokeStyle = [
        "rgba(105,240,255,.9)",
        "rgba(135,145,255,.8)",
        "rgba(55,160,255,.65)"
      ][i];
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, radius + 22 + i * 16,
        radius + 22 + i * 16, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // Deterministic particles: identical frame = identical image
    for (let i = 0; i < 100; i++) {
      const seed = i * 127.1 + 311.7;
      const rand = x => {
        const v = Math.sin(x) * 43758.5453;
        return v - Math.floor(v);
      };

      const x = rand(seed) * W;
      const baseY = rand(seed + 5) * H;
      const y = (baseY - t * (25 + rand(seed + 9) * 60) + H * 3) % H;
      const r = .7 + rand(seed + 11) * 1.7;

      ctx.globalAlpha = .3 + rand(seed + 15) * .6;
      ctx.fillStyle = i % 3 ? "#8bdcff" : "#ffffff";
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Opening light flash
    if (t < .5) {
      ctx.globalAlpha = (1 - t / .5) * .65;
      const flash = ctx.createRadialGradient(640, 300, 0, 640, 300, 180);
      flash.addColorStop(0, "#ffffff");
      flash.addColorStop(1, "rgba(100,180,255,0)");
      ctx.fillStyle = flash;
      ctx.fillRect(400, 100, 480, 400);
      ctx.globalAlpha = 1;
    }

    // Cinematic vignette
    const vignette = ctx.createRadialGradient(640, 350, 200, 640, 350, 780);
    vignette.addColorStop(0, "rgba(0,0,0,0)");
    vignette.addColorStop(1, "rgba(0,0,0,.65)");
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    document.documentElement.dataset.frame = frame;
  };

  window.renderFrame(0, 30);
  document.documentElement.classList.add("ready");
})();
</script>
</body>
</html>

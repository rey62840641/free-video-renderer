
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunny Bo and the Rainbow</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:"Trebuchet MS",Arial,sans-serif;background:#80d8ff}
#stage{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:linear-gradient(#61c8ff 0%,#c4efff 65%,#9ce879 65%,#43bd65 100%);
}
.sun{
  position:absolute;width:125px;height:125px;right:9%;top:8%;
  border-radius:50%;background:#ffe66b;
  box-shadow:0 0 55px #fff3a0;
  animation:sunfloat 4s ease-in-out infinite;
}
.cloud{
  position:absolute;width:180px;height:55px;border-radius:60px;
  background:white;top:13%;left:-200px;
  animation:cloudmove 12s linear infinite;
}
.cloud:before,.cloud:after{
  content:"";position:absolute;background:white;border-radius:50%;
}
.cloud:before{width:75px;height:75px;left:25px;top:-35px}
.cloud:after{width:90px;height:90px;right:25px;top:-45px}
.cloud.two{top:25%;animation-delay:-6s;transform:scale(.7)}
.hill{
  position:absolute;bottom:-20%;width:80%;height:48%;
  background:#6ed568;border-radius:50% 50% 0 0;
}
.hill.one{left:-20%}
.hill.two{right:-25%;height:39%;background:#43bb65}
.flower{
  position:absolute;bottom:13%;font-size:clamp(22px,4vw,48px);
  animation:sway 2s ease-in-out infinite alternate;
}
#rainbow{
  position:absolute;width:50vw;height:50vw;max-height:75vh;
  max-width:75vh;border-radius:50%;left:50%;top:43%;
  transform:translate(-50%,-50%);
  border:20px solid transparent;
  border-top-color:#ff626b;border-left-color:#ff626b;
  opacity:0;filter:drop-shadow(0 4px 5px #ffffff66);
  animation:rainbowin 15s linear forwards;
}
.character{
  position:absolute;bottom:17%;width:22%;max-width:270px;
  min-width:150px;aspect-ratio:.82;
  animation:bounce 1s ease-in-out infinite;
}
#bunny{left:24%;z-index:3}
#duck{right:23%;z-index:2;animation-delay:-.45s}
.body{
  position:absolute;width:76%;height:58%;left:12%;bottom:0;
  border-radius:48% 48% 40% 40%;
  background:#fff4db;border:4px solid #d9bfa0;
  box-shadow:inset -12px -8px 0 #ead7b9;
}
.ear{
  position:absolute;width:24%;height:54%;top:-22%;
  border-radius:50%;background:#fff4db;
  border:4px solid #d9bfa0;transform-origin:bottom center;
}
.ear:after{
  content:"";position:absolute;inset:12% 25%;
  border-radius:50%;background:#ff9ab6;
}
.ear.left{left:23%;transform:rotate(-17deg)}
.ear.right{right:23%;transform:rotate(17deg)}
.head{
  position:absolute;width:88%;height:63%;left:6%;top:8%;
  border-radius:50%;background:#fff4db;
  border:4px solid #d9bfa0;
}
.eye{
  position:absolute;width:9%;height:12%;top:40%;
  border-radius:50%;background:#382c35;
}
.eye.left{left:26%}.eye.right{right:26%}
.cheek{
  position:absolute;width:18%;height:10%;top:55%;
  border-radius:50%;background:#ffb0b8;
}
.cheek.left{left:12%}.cheek.right{right:12%}
.nose{
  position:absolute;left:44%;top:51%;width:13%;height:10%;
  border-radius:50%;background:#f28a9d;
}
.mouth{
  position:absolute;left:42%;top:61%;width:18%;height:10%;
  border-bottom:4px solid #66404b;border-radius:50%;
}
#duck .body{background:#ffdc42;border-color:#e7a92e;
  box-shadow:inset -12px -8px 0 #f5c12f}
#duck .head{background:#ffe76b;border-color:#e7a92e}
#duck .ear{display:none}
#duck .nose{
  left:68%;top:49%;width:28%;height:17%;
  border-radius:50% 15% 50% 50%;background:#ff914d;
}
#duck .mouth{display:none}
#duck .eye{top:34%}
#duck .wing{
  position:absolute;width:38%;height:28%;left:0;top:49%;
  background:#f5c52e;border-radius:50%;
  border:3px solid #e7a92e;transform:rotate(-20deg);
}
#bunny .bow{
  position:absolute;left:39%;top:0;width:30%;height:17%;
  background:#ff6fa6;border-radius:50%;
  clip-path:polygon(0 0,50% 30%,100% 0,90% 100%,50% 65%,10% 100%);
}
#caption{
  position:absolute;z-index:10;left:5%;right:5%;bottom:4%;
  text-align:center;color:white;font-weight:900;
  font-size:clamp(24px,4vw,58px);
  text-shadow:0 4px 0 #633c89,0 7px 12px #32244f88;
  padding:12px 18px;border-radius:22px;
  background:#633c8977;
  border:3px solid #ffffffaa;
}
#title{
  position:absolute;z-index:8;top:5%;left:5%;right:5%;
  text-align:center;color:white;font-size:clamp(25px,4vw,56px);
  font-weight:900;text-shadow:0 4px 0 #f08b54,0 7px 10px #3336;
  animation:titlepop 1s ease-out both;
}
#raindrops{position:absolute;inset:0;pointer-events:none}
.drop{
  position:absolute;top:-30px;width:4px;height:25px;
  border-radius:5px;background:#fff;
  animation:rainfall .65s linear infinite;
}
#puddle{
  position:absolute;bottom:12%;left:35%;width:30%;height:25px;
  border-radius:50%;background:#b6f1ff;opacity:0;
  animation:puddle 15s linear forwards;
}
@keyframes cloudmove{from{left:-200px}to{left:110%}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-2deg)}
50%{transform:translateY(-20px) rotate(2deg)}}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes sunfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes titlepop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rainfall{to{transform:translateY(115vh)}}
@keyframes rainbowin{
  0%,55%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  70%,100%{opacity:.95;transform:translate(-50%,-50%) scale(1)}
}
@keyframes puddle{
  0%,5%{opacity:0;transform:scale(.2)}
  15%,60%{opacity:1;transform:scale(1)}
  75%,100%{opacity:0}
}
@media(max-width:600px){
  #bunny{left:12%}#duck{right:10%}
  .character{min-width:120px}
}
</style>
</head>
<body>
<div id="stage">
  <div class="sun"></div>
  <div class="cloud"></div><div class="cloud two"></div>
  <div class="hill one"></div><div class="hill two"></div>
  <div id="rainbow"></div>
  <div id="raindrops"></div>
  <div id="puddle"></div>

  <div class="flower" style="left:8%">🌼</div>
  <div class="flower" style="left:47%;animation-delay:-.7s">🌷</div>
  <div class="flower" style="right:8%;animation-delay:-1s">🌻</div>

  <div id="title">🐰 Bunny Bo's Rainbow Day! 🌈</div>

  <div class="character" id="bunny">
    <div class="ear left"></div><div class="ear right"></div>
    <div class="body"></div>
    <div class="head">
      <div class="eye left"></div><div class="eye right"></div>
      <div class="cheek left"></div><div class="cheek right"></div>
      <div class="nose"></div><div class="mouth"></div>
    </div>
    <div class="bow"></div>
  </div>

  <div class="character" id="duck">
    <div class="body"></div><div class="wing"></div>
    <div class="head">
      <div class="eye left"></div><div class="eye right"></div>
      <div class="cheek left"></div><div class="cheek right"></div>
      <div class="nose"></div><div class="mouth"></div>
    </div>
  </div>

  <div id="caption">Come and sing along!</div>
</div>

<script>
const stage = document.getElementById("stage");
const drops = document.getElementById("raindrops");
const caption = document.getElementById("caption");
const title = document.getElementById("title");
const bunny = document.getElementById("bunny");
const duck = document.getElementById("duck");

for(let i=0;i<55;i++){
  const d=document.createElement("div");
  d.className="drop";
  d.style.left=(Math.random()*100)+"%";
  d.style.animationDelay=(-Math.random()*1.5)+"s";
  d.style.opacity=.35+Math.random()*.65;
  drops.appendChild(d);
}

const scenes=[
 {t:0, text:"Bunny Bo wakes up to the rain!", rain:true},
 {t:2.5, text:"Hop, hop, hop — splish and play!", rain:true},
 {t:5, text:"Little Duck says, “Quack! Hooray!”", rain:true},
 {t:7.5, text:"Sun peeks out to light the sky!", rain:false},
 {t:10, text:"Rainbow colours wave hello!", rain:false},
 {t:12.5, text:"Hop with Bo — away we go!", rain:false}
];

function renderFrame(t){
  const s=[...scenes].reverse().find(x=>t>=x.t)||scenes[0];
  caption.textContent=s.text;
  drops.style.opacity=s.rain?"1":"0";
  title.style.opacity=t<13?"1":".75";
  bunny.style.transform=`translateY(${Math.sin(t*5)*8}px) rotate(${Math.sin(t*2)*3}deg)`;
  duck.style.transform=`translateY(${Math.sin(t*5+1)*8}px) rotate(${Math.sin(t*2+1)*3}deg)`;
  if(t>=7.5){
    stage.style.background="linear-gradient(#58c7ff 0%,#d6f7ff 65%,#9ce879 65%,#43bd65 100%)";
  }else{
    stage.style.background="linear-gradient(#61c8ff 0%,#c4efff 65%,#9ce879 65%,#43bd65 100%)";
  }
  window.renderTime=t;
}
window.renderFrame=renderFrame;
renderFrame(0);
</script>
</body>
</html>
